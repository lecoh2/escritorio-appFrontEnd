<div class="container-fluid p-0">

    <h1 class="h3 mb-3">Editar Caso</h1>

    <div class="card">

        <div class="card-header">
            <h5 class="card-title">Edição de Caso</h5>
            <h6 class="card-subtitle text-muted">Altere os dados do caso</h6>
        </div>

        <div class="card-body">

            <div
                class="alert alert-primary border-0 shadow-sm d-flex align-items-center p-3 mb-4 rounded-3 alert-dismissible fade show"
                role="alert">

                <div class="me-3">
                    <i class="fas fa-circle-info fs-4 text-white bg-primary rounded-circle p-2"></i>
                </div>

                <div class="flex-grow-1">
                    <h6 class="fw-bold mb-0">
                        Preencha os campos marcados com <strong>*</strong>. Os demais são opcionais.
                    </h6>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
                </button>

            </div>

            <app-spinner
                *ngIf="carregando"
                [show]="true"
                message="Salvando...">
            </app-spinner>

            <app-alerts
                *ngIf="mensagemSucesso.length"
                titulo="Sucesso!"
                [mensagens]="mensagemSucesso"
                tipo="success">
            </app-alerts>

            <app-alerts
                *ngIf="mensagemErro.length"
                titulo="Erro!"
                [mensagens]="mensagemErro"
                tipo="danger">
            </app-alerts>

            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <!-- PASTA -->
                <div class="mb-3">

                    <label class="form-label">
                        Pasta *
                    </label>

                    <input
                        class="form-control"
                        formControlName="pasta">

                    <div
                        class="text-danger mt-1"
                        *ngIf="form.get('pasta')?.touched && form.get('pasta')?.errors">

                        <div *ngIf="form.get('pasta')?.errors?.['required']">
                            A pasta é obrigatória.
                        </div>

                    </div>

                </div>


                <!-- CLIENTES + ENVOLVIDOS -->
             <div class="row mb-3 autocomplete-row">

    <div class="col-md-6 autocomplete-col">
        <app-autocomplete-pessoa-atendimento
            label="Clientes *"
            placeholder="Digite o cliente"
            [resultados]="clientesFiltrados"
            [(selecionadas)]="clientesSelecionados"
            (buscar)="buscarClientes($event)">
        </app-autocomplete-pessoa-atendimento>
    </div>

    <div class="col-md-6 autocomplete-col">
        <app-autocomplete-pessoa
            label="Outros envolvidos"
            placeholder="Digite o nome do envolvido"
            [resultados]="envolvidosFiltrados"
            [(selecionadas)]="envolvidosSelecionados"
            [qualificacoes]="qualificacoes"
            (buscar)="buscarEnvolvidos($event)">
        </app-autocomplete-pessoa>
    </div>

</div>

                <!-- TÍTULO + RESPONSÁVEL -->
                <div class="row mb-3">

                    <!-- TÍTULO -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Título *
                        </label>

                        <input
                            class="form-control"
                            formControlName="titulo">

                        <div
                            class="text-danger mt-1"
                            *ngIf="form.get('titulo')?.touched && form.get('titulo')?.errors">

                            <div *ngIf="form.get('titulo')?.errors?.['required']">
                                O título é obrigatório.
                            </div>

                        </div>

                    </div>


                    <!-- RESPONSÁVEL -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Responsável *
                        </label>

                        <select
                            class="form-select"
                            formControlName="responsavelId">

                            <option [ngValue]="null">
                                Selecione
                            </option>

                            <option
                                *ngFor="let r of responsaveis"
                                [ngValue]="r.id">

                                {{ r.nomeUsuario }}

                            </option>

                        </select>

                        <div
                            class="text-danger mt-1"
                            *ngIf="form.get('responsavelId')?.touched && form.get('responsavelId')?.errors">

                            <div *ngIf="form.get('responsavelId')?.errors?.['required']">
                                O responsável é obrigatório.
                            </div>

                        </div>

                    </div>

                </div>


                <!-- ETIQUETAS -->
                <div class="mb-3">

                    <label class="form-label">
                        Etiquetas
                    </label>

                    <app-etiquetas
                        [etiquetas]="tiposEtiquetas"
                        [(selecionadas)]="etiquetasSelecionadas">
                    </app-etiquetas>

                </div>


                <!-- DESCRIÇÃO -->
                <div class="mb-3">

                    <label class="form-label">
                        Descrição *
                    </label>

                    <textarea
                        class="form-control"
                        formControlName="descricao">
                    </textarea>

                    <div
                        class="text-danger mt-1"
                        *ngIf="form.get('descricao')?.touched && form.get('descricao')?.errors">

                        <div *ngIf="form.get('descricao')?.errors?.['required']">
                            A descrição é obrigatória.
                        </div>

                    </div>

                </div>


                <!-- OBSERVAÇÃO -->
                <div class="mb-3">

                    <label class="form-label">
                        Observação
                    </label>

                    <textarea
                        class="form-control"
                        formControlName="observacao">
                    </textarea>

                </div>


                <!-- VOLTAR -->
                <button
                    type="button"
                    class="btn btn-secondary mt-3 me-2"
                    (click)="irParaLista()">

                    <i class="fas fa-arrow-left"></i>
                    Voltar

                </button>


                <!-- ATUALIZAR -->
                <button
                    type="submit"
                    class="btn btn-primary mt-3"
                    [disabled]="carregando">

                    <i class="fas fa-save"></i>
                    Atualizar Caso

                </button>

            </form>

        </div>

    </div>

</div>
